groups:
  - name: vgreens-platform
    rules:
      - alert: NASUnavailable
        expr: vgreens_nas_mounted == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "NAS not mounted on the GPU host"
          description: "The Job API reports the NAS is not mounted — training/registry writes will fail."

      - alert: JobAPIDown
        expr: up{job="vgreens-api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Job API is unreachable"
          description: "Prometheus cannot scrape the Job API /metrics — the service may be down."

      - alert: QueueUnreachable
        expr: up{job="rabbitmq"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "RabbitMQ metrics endpoint down"
          description: "The broker's Prometheus endpoint is unreachable — jobs cannot be queued/consumed."

      - alert: GPUsNotVisible
        expr: up{job="gpu"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "GPU exporter down / GPUs not visible"
          description: "The NVIDIA exporter is not reporting — GPUs may be missing or the driver/runtime failed."

      - alert: HostExporterDown
        expr: up{job="node"} == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Host node-exporter down"
          description: "Host metrics are not being collected."

      - alert: WorkerStopped
        expr: vgreens_worker_seconds_since_heartbeat > 90
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "GPU worker {{ $labels.worker }} stopped checking in"
          description: "No heartbeat from {{ $labels.worker }} for over 90s — the worker may be down."

      - alert: GPUTemperatureHigh
        expr: nvidia_smi_temperature_gpu > 85
        for: 3m
        labels: {severity: warning}
        annotations:
          summary: "GPU running hot (>85°C)"
          description: "A GPU has been above 85°C for 3 minutes — check cooling / job load."

      - alert: DiskAlmostFull
        expr: (node_filesystem_avail_bytes{mountpoint="/host",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/host",fstype!~"tmpfs|overlay"}) < 0.15
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Host root filesystem over 85% full"
          description: "Less than 15% free on the host root filesystem."
