global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml
  - /etc/prometheus/recording.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: gpu
    static_configs:
      - targets: ['gpu-exporter:9835']

  - job_name: rabbitmq
    static_configs:
      - targets: ['vgreens-rabbitmq:15692']

  # The Job API runs as a host systemd service, not in this compose network,
  # so we reach it via the docker host gateway (see extra_hosts on prometheus).
  - job_name: vgreens-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8000']
