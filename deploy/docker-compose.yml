# vGreens AI platform — infrastructure containers.
# Phase 1.2: RabbitMQ only. Phase 2.5 adds prometheus + grafana here.
#
# Credentials + bind address come from /opt/vgreens-ai/.env (root-only, NOT in git).
# Queues (training_jobs / processing_jobs / failed_jobs) are declared by the API and
# worker at startup — never created by hand here.

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: vgreens-rabbitmq
    hostname: vgreens-rabbitmq          # stable node name -> stable mnesia data dir
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      # Bind to the LAN only. RABBITMQ_BIND defaults to 0.0.0.0; the box has no
      # public IP, and a ufw rule (see install.md) keeps 15672 off other subnets.
      - "${RABBITMQ_BIND:-0.0.0.0}:5672:5672"     # AMQP
      - "${RABBITMQ_BIND:-0.0.0.0}:15672:15672"   # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq          # persists queues across restarts
      - ./monitoring/rabbitmq_enabled_plugins:/etc/rabbitmq/enabled_plugins:ro  # + prometheus plugin (15692)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --- monitoring (Phase 2.5) ---------------------------------------------- #
  # UIs bound to localhost by default (reach via SSH tunnel). Set MON_BIND to
  # a LAN IP only if you want them on the LAN.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: vgreens-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - ./monitoring/recording.rules.yml:/etc/prometheus/recording.rules.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so it can scrape the host's Job API
    ports:
      - "${MON_BIND:-127.0.0.1}:9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: vgreens-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-vgreens}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${MON_BIND:-127.0.0.1}:3000:3000"
    depends_on: [prometheus]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: vgreens-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro,rslave'

  # NVIDIA GPU metrics (wraps nvidia-smi). Needs the nvidia container runtime.
  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.2.0
    container_name: vgreens-gpu-exporter
    restart: unless-stopped
    # AUTO field discovery panics on driver 595 (invalid metric names from
    # clocks_event_reasons.* [us]); query an explicit, known-good field set.
    command:
      - '--query-field-names=utilization.gpu,utilization.memory,memory.total,memory.used,memory.free,temperature.gpu,power.draw,fan.speed,name'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

volumes:
  rabbitmq_data:
    name: vgreens_rabbitmq_data
  prometheus_data:
    name: vgreens_prometheus_data
  grafana_data:
    name: vgreens_grafana_data
